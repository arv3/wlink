# Cross-compilation settings for Windows targets.
# See BUILDING.md for one-time setup and full instructions.

# --- x86_64 Windows (GNU) -------------------------------------------------
# Works on stable out of the box. Needs: mingw-w64 (brew install mingw-w64).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# --- i686 / 32-bit Windows (GNU) ------------------------------------------
# Homebrew's i686 mingw-w64 is built with SjLj exceptions, but Rust's prebuilt
# i686-pc-windows-gnu std expects DWARF-2 unwinding -> `_Unwind_Resume` link
# errors. panic=abort drops the unwinder entirely; std must be rebuilt to match,
# so this target requires nightly + `-Z build-std=std,panic_abort` (see alias
# `win32` below and BUILDING.md). The rustflag here is harmless for other targets
# because it is scoped to this target only.
[target.i686-pc-windows-gnu]
linker = "i686-w64-mingw32-gcc"
rustflags = ["-C", "panic=abort"]

# --- Convenience aliases --------------------------------------------------
# Run the GNU 32-bit build with nightly: `cargo +nightly win32`
[alias]
win64 = "build --release --target x86_64-pc-windows-gnu"
win32 = "build --release --target i686-pc-windows-gnu -Z build-std=std,panic_abort"
