name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types:
      - created
  schedule: # Every day at 2 P.M. (UTC) we run a scheduled nightly build
    - cron: "0 14 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: build (${{ matrix.config.arch }})
    strategy:
      matrix:
        config:
          - os: windows-latest
            arch: win-x64
          - os: ubuntu-latest
            arch: linux-x64
          - os: macos-latest
            arch: macos-arm64
    runs-on: ${{ matrix.config.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ env.ZIG_VERSION }}
    - name: Build
      run: zig build -Doptimize=ReleaseSafe
    - name: Run tests
      run: zig build test
    - name: Run help
      run: zig build run -- --help

    - name: Prepare artifacts
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          WLINK_EXE="zig-out/bin/wlink.exe"
        else
          WLINK_EXE="zig-out/bin/wlink"
        fi

        mkdir wlink-${{ matrix.config.arch }}
        cp "$WLINK_EXE" wlink-${{ matrix.config.arch }}
        cp README.md wlink-${{ matrix.config.arch }}
      shell: bash
    - uses: actions/upload-artifact@v4
      with:
        name: wlink-${{ matrix.config.arch }}
        path: wlink-${{ matrix.config.arch }}

    - name: Prepare Release Asset
      if: github.event_name == 'release'
      run: |
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          7z a -tzip wlink-${{ github.event.release.tag_name }}-${{ matrix.config.arch }}.zip wlink-${{ matrix.config.arch }}
        else
          tar -czvf wlink-${{ github.event.release.tag_name }}-${{ matrix.config.arch }}.tar.gz wlink-${{ matrix.config.arch }}
        fi
      shell: bash
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release'
      with:
        fail_on_unmatched_files: false
        files: |
          wlink-*.tar.gz
          wlink-*.zip

  nightly-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: Prepare Nightly Asset
        run: |
          ls -R ./
          for f in wlink-*; do
            echo "Compressing $f"
            if [[ $f == wlink-win* ]]; then
              zip -r $f.zip $f
            else
              tar -czvf $f.tar.gz $f
            fi
          done
          ls ./

      - name: Update Nightly Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: "wlink nightly release $$"
          draft: false
          prerelease: true
          # Skip republishing when the nightly tag is already at HEAD — avoids
          # spamming watchers with empty re-releases on cron runs (issue #92).
          only-when-changed: true
          body: |
            This is a nightly binary release of the wlink command line tool.
          files: |
            wlink-*.tar.gz
            wlink-*.zip
